name: Тесты

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - name: Получение кода
        uses: actions/checkout@v7

      - name: Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Скрипт запускается и печатает справку
        run: python s3_sync.py --help > /dev/null

      - name: Пример конфигурации — корректный TOML
        run: |
          python - <<'PY'
          try:
              import tomllib as toml
          except ModuleNotFoundError:  # Python 3.9/3.10
              import tomli as toml
          from pathlib import Path

          data = toml.loads(Path("s3-sync.conf.example").read_text(encoding="utf-8"))
          assert "storage" in data and "folders" in data, "в примере нет [storage] или [[folders]]"
          print("s3-sync.conf.example разобран успешно")
          PY

      - name: Тесты с покрытием
        env:
          # Тесты запускают s3_sync.py отдельным процессом, поэтому coverage нужно
          # поднимать и в дочерних интерпретаторах: .pth-хук вызывает
          # process_startup(), который читает эту переменную, а parallel = True
          # заставляет каждый процесс писать свой файл данных — их склеит combine.
          COVERAGE_PROCESS_START: ${{ github.workspace }}/.coveragerc
        run: |
          SITE="$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          echo 'import coverage; coverage.process_startup()' > "$SITE/coverage-subprocess.pth"
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage combine

      - name: Отчёт о покрытии и порог
        run: |
          python -m coverage xml -o coverage.xml
          python -m coverage html -d htmlcov
          set +e
          python -m coverage report -m | tee coverage.txt
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "### Покрытие тестами (Python ${{ matrix.python-version }})"
            echo
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Артефакт с отчётом о покрытии
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov
          retention-days: 14

      # Публикация во внешний сервис включается переменной репозитория
      # CODECOV_ENABLED=true (Settings → Secrets and variables → Actions → Variables)
      # и секретом CODECOV_TOKEN. Пока переменной нет, шаг пропускается, и прогон
      # не зависит от доступности стороннего сервиса.
      - name: Публикация покрытия в Codecov
        if: always() && vars.CODECOV_ENABLED == 'true'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          disable_search: true
          flags: python-${{ matrix.python-version }}
          name: python-${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
